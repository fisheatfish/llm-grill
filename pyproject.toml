[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-bench"
dynamic = ["version"]
description = "CLI for benchmarking LLM inference servers (vLLM, SGLang, llama.cpp)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Karim Sayadi" },
    { name = "Gireg Roussel" },
]
keywords = ["llm", "benchmark", "inference", "vllm", "sglang", "llamacpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "httpx>=0.27",
    "anyio>=4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/fisheatfish/llm-bench"
Repository = "https://github.com/fisheatfish/llm-bench"
Issues = "https://github.com/fisheatfish/llm-bench/issues"
Changelog = "https://github.com/fisheatfish/llm-bench/blob/main/CHANGELOG.md"

[project.scripts]
llm-bench = "llm_bench.cli:app"

[tool.hatch.version]
path = "src/llm_bench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_bench"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
