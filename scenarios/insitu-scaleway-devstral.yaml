# Benchmark scenario — Devstral-Small-2-24B on Scaleway infrastructure
# À exécuter DEPUIS le serveur gateway (DEV1-M) pour accès direct aux backends.
#
# Avantages vs scaleway-devstral.yaml :
#   - KV cache hit rate disponible (SGLang /get_server_info)
#   - KV cache usage disponible (vLLM /metrics Prometheus)
#   - Mesures TTFT/TPOT sans latence gateway
#
# ── AVANT DE LANCER ─────────────────────────────────────────────────────────
# Remplacer les valeurs marquées  ← À MODIFIER  ci-dessous.
# Pour connaître le model name exact de chaque serveur :
#   curl http://<ip>:<port>/v1/models | jq '.data[].id'
# ─────────────────────────────────────────────────────────────────────────────

name: insitu-scaleway-devstral
description: >
  Benchmark Devstral-Small-2-24B-Instruct-2512 across three backends, run in-situ
  from the gateway server. Direct backend access enables KV cache metrics collection.

backends:
  - name: gpu-llama
    url: http://172.16.0.9:8001        # ← À MODIFIER  ex. http://xx.xxx.xxx.xxx:8001
    api_key: none
    type: llamacpp
    timeout: 120.0
    gpu_monitoring: true

  - name: gpu-vllm
    url: http://172.16.0.3:8001        # ← À MODIFIER  ex. http://xx.xxx.xxx.xxx:8001
    api_key: none
    type: vllm
    timeout: 120.0
    gpu_monitoring: true

  - name: gpu-sglang
    url: http://172.16.0.8:8001        # ← À MODIFIER  ex. http://xx.xxx.xxx.xxx:8001
    api_key: none
    type: sglang
    timeout: 120.0
    gpu_monitoring: true

models:
  - name: devstral-small             # ← À MODIFIER  id exact retourné par /v1/models
    max_tokens: 512
    temperature: 0.7
  - name: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    max_tokens: 512
    temperature: 0.7

conversations:
  - name: short-code-question
    description: Single-turn, short prompt — baseline latency
    turns:
      - role: user
        content: "Write a Python function that returns the nth Fibonacci number using memoization."

  - name: multi-turn-debug
    description: Multi-turn conversation simulating a debug session — tests KV cache reuse
    turns:
      - role: system
        content: "You are an expert Python developer. Be concise."
      - role: user
        content: "I have a FastAPI app that sometimes returns 500 errors under load. What should I check first?"
      - role: user
        content: "I found that the DB connection pool is exhausted. How do I configure SQLAlchemy pool size?"
      - role: user
        content: "What pool size would you recommend for 50 concurrent users?"

  - name: long-context
    description: Long prompt to stress prefill time and KV cache
    turns:
      - role: user
        content: |
          Here is a large Python module with several classes and functions.
          Please review it and suggest performance improvements.

          ```python
          import time
          import random
          from typing import List, Dict, Optional

          class DataProcessor:
              def __init__(self, data: List[Dict]):
                  self.data = data
                  self.cache = {}

              def process_all(self) -> List[Dict]:
                  results = []
                  for item in self.data:
                      result = self.process_item(item)
                      results.append(result)
                  return results

              def process_item(self, item: Dict) -> Dict:
                  key = str(item.get('id'))
                  if key in self.cache:
                      return self.cache[key]
                  # Simulate expensive computation
                  time.sleep(0.001)
                  processed = {k: v * 2 if isinstance(v, int) else v for k, v in item.items()}
                  self.cache[key] = processed
                  return processed

              def filter_by_threshold(self, threshold: int) -> List[Dict]:
                  return [item for item in self.data if item.get('value', 0) > threshold]

              def aggregate(self) -> Dict:
                  total = sum(item.get('value', 0) for item in self.data)
                  count = len(self.data)
                  return {'total': total, 'count': count, 'average': total / count if count else 0}

          def generate_data(n: int) -> List[Dict]:
              return [{'id': i, 'value': random.randint(0, 100), 'label': f'item_{i}'} for i in range(n)]

          if __name__ == '__main__':
              data = generate_data(10000)
              processor = DataProcessor(data)
              results = processor.process_all()
              filtered = processor.filter_by_threshold(50)
              stats = processor.aggregate()
              print(stats)
          ```

          Focus on: algorithmic complexity, memory usage, and Python idioms.

targets:
  # --- Baseline: latence par backend ---
  - backend: gpu-llama
    model: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    conversation: short-code-question

  - backend: gpu-vllm
    model: devstral-small
    conversation: short-code-question

  - backend: gpu-sglang
    model: devstral-small
    conversation: short-code-question

  # --- KV cache: multi-turn (vLLM vs SGLang) ---
  - backend: gpu-vllm
    model: devstral-small
    conversation: multi-turn-debug

  - backend: gpu-sglang
    model: devstral-small
    conversation: multi-turn-debug

  # --- Prefill stress: long context (vLLM vs SGLang) ---
  - backend: gpu-vllm
    model: devstral-small
    conversation: long-context

  - backend: gpu-sglang
    model: devstral-small
    conversation: long-context

load:
  concurrent_users: 10   # ← ajuster selon capacité GPU (réduire si timeouts)
  iterations: 3
  ramp_up_seconds: 5.0
  think_time_seconds: 0.0
